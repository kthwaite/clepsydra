name: CI

on:
  push:
    branches: [prod, dev]
  pull_request:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No build, no frontend assets, no cache: rustfmt only parses.
      - name: Format
        run: cargo fmt --all -- --check

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # vitest's bin runs on `node`, not Bun; match the local major so
      # jsdom/Storage and microtask timing behave the same as on dev machines.
      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  backend:
    # Both platforms, deliberately. Every platform-specific branch in the vault
    # layer - the CAS descriptor handling, the filesystem watcher backend - has
    # only ever been exercised on whichever machine the author happened to be
    # using, and that is exactly where the bugs have been.
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # `crates/clep-frontend-assets/src/lib.rs` embeds `ui/dist` via rust-embed, so
      # that crate (and so the `clep` binary) does not compile at all until the
      # frontend has been built once. This is a
      # build input, not a duplicate of the frontend job - that job gates the UI
      # itself, this one only needs the assets to exist.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Build embedded frontend assets
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --no-fail-fast -- --test-threads=4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install native preview test dependencies
        run: npm --prefix preview-worker ci --ignore-scripts --no-audit --no-fund

      - name: Allow Chromium's native sandbox on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apparmor_parser -r .github/clep-preview.apparmor
          node preview-worker/node_modules/playwright-core/cli.js install-deps chromium

      - name: Native browser lifecycle regressions
        run: |
          node preview-worker/node_modules/playwright-core/cli.js install --no-shell chromium
          ui/node_modules/.bin/biome check preview-worker/*.mjs preview-worker/package.json
          npm --prefix preview-worker test

      - name: Installed native preview smoke
        run: |
          cargo run --locked -p clep -- previews install
          cargo test --locked -p clep-api actual_worker_renders_checked_html_and_relative_resources -- --ignored
