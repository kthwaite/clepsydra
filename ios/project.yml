name: ClepsydraMobile

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  ClepsydraMobileKit:
    path: Packages/ClepsydraMobileKit

targets:
  ClepsydraMobile:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ClepsydraMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clepsydra.mobile
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    dependencies:
      - package: ClepsydraMobileKit
        product: ClepsydraUI
