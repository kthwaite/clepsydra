<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/styles/clepsydra.css">
  <style>
    /* Popup-specific layout. The palette, type, controls and focus ring come
       from /styles/clepsydra.css, which both extension pages share. */
    body {
      width: 320px;
    }
    .rail-top {
      padding: 14px 14px 0;
    }
    .rail-bottom {
      padding: 0 14px 12px;
    }
    .body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
    }
    .captured-indicator {
      --tone: var(--warn);
    }
    .capture-tags {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .capture-tags .field-label {
      margin-bottom: 0;
    }
    /* The eyebrow over the default tags carries the section tick. */
    #capture-tags-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag-list {
      display: flex;
      min-height: 22px;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      color: var(--mute);
      font-size: 12.5px;
    }
    /* An empty live region must not hold open a row of dead space. */
    .tag-list:empty {
      min-height: 0;
    }
    .tag-remove {
      height: auto;
      padding: 0;
      border-radius: 0;
      background: none;
      color: var(--mute);
      font-size: 12.5px;
      font-weight: 400;
      line-height: 1;
    }
    .tag-remove:hover:not(:disabled) {
      background: none;
      color: var(--hot);
    }
    /* Suggested tags are chips that happen to be buttons: the chip's shape and
       size win over the quiet button's. */
    .tag-suggested {
      height: auto;
      padding: 2px 8px;
      border-radius: 9999px;
      color: var(--ink-2);
      font-size: 12.5px;
      font-weight: 400;
      line-height: 1.4;
    }
    .tag-suggested::before {
      content: "+";
      color: var(--accent);
    }
    .tag-suggested:hover:not(:disabled) {
      background: var(--accent-tint);
      color: var(--ink);
    }
    /* The one overlay in the popup, so the one place elevation appears. */
    .tag-suggestions {
      max-height: 132px;
      margin: 2px 0 0;
      padding: 4px;
      border-radius: var(--radius);
      background: var(--raise);
      box-shadow: var(--elev-2);
      list-style: none;
      overflow-y: auto;
    }
    .tag-suggestions [role="option"] {
      padding: 6px 10px;
      border-radius: 8px;
      color: var(--ink-2);
      cursor: pointer;
    }
    .tag-suggestions [role="option"][aria-selected="true"],
    .tag-suggestions [role="option"]:hover {
      background: var(--accent-tint);
      color: var(--ink);
    }
    #capture-btn {
      width: 100%;
    }
    .capture-progress {
      height: 4px;
      overflow: hidden;
      border-radius: 9999px;
      background: var(--sink);
    }
    .capture-progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 9999px;
      background: var(--accent);
      transition: width 150ms ease-out;
    }
    .capture-progress-fill.indeterminate {
      width: 30%;
      animation: capture-progress-slide 1.2s ease-in-out infinite alternate;
    }
    @keyframes capture-progress-slide {
      from { margin-left: 0; }
      to { margin-left: 70%; }
    }
    /* Tones: mute reads, accent works, ok settles, warn hesitates, hot fails.
       popup.ts shows the panel by setting display itself. */
    .capture-status {
      display: none;
    }
    .capture-status[data-tone="reading"] { --tone: var(--mute); }
    .capture-status[data-tone="processing"] { --tone: var(--accent); }
    .capture-status[data-tone="success"] { --tone: var(--ok); }
    .capture-status[data-tone="conflict"] { --tone: var(--warn); }
    .capture-status[data-tone="error"] { --tone: var(--hot); }
    .capture-link {
      display: inline-block;
      align-self: flex-start;
      font-size: 13px;
    }
    .error {
      display: none;
      --tone: var(--hot);
    }
    .status {
      display: flex;
      min-width: 0;
      flex: 1;
      align-items: center;
      gap: 8px;
      color: var(--mute);
      font-size: 12.5px;
    }
    /* Status dot — the app's 7px round StatusDot, faint until reachability
       is known. */
    .dot {
      flex: none;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--faint);
    }
    .dot.connected { background: var(--accent); }
    .dot.disconnected { background: var(--hot); }
    #status-text {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    /* 24px keeps the link a usable pointer target in a text-sized footer. */
    .settings-link {
      display: inline-flex;
      min-height: 24px;
      flex: none;
      align-items: center;
      border-bottom: none;
      color: var(--mute);
      font-size: 12.5px;
    }
    .settings-link:hover {
      background: none;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header class="rail rail-top">
    <div class="wordmark">Clepsydra</div>
    <div class="rail-label">Web archive</div>
  </header>
  <main class="body">
    <div class="captured-indicator panel" id="captured-indicator" hidden></div>
    <section class="capture-tags" aria-labelledby="capture-tags-label">
      <div id="capture-tags-label" class="field-label"><span class="tick" aria-hidden="true"></span>Defaults</div>
      <div id="default-tags" class="tag-list" aria-live="polite">Loading…</div>
      <label class="field-label" for="additional-tags">Additional tags</label>
      <div id="selected-tags" class="tag-list" aria-live="polite"></div>
      <input id="additional-tags" type="text" autocomplete="off" role="combobox"
             aria-expanded="false" aria-controls="tag-suggestions" aria-autocomplete="list"
             placeholder="research, reading" aria-describedby="additional-tags-help">
      <ul id="tag-suggestions" class="tag-suggestions" role="listbox" hidden></ul>
      <div id="suggested-tags" class="tag-list" role="group" aria-label="Suggested from this page" hidden></div>
      <p id="additional-tags-help" class="field-help">Applies only to this capture. Type to search vault tags. Suggested tags come from this page.</p>
    </section>
    <button id="capture-btn" class="btn-primary">Capture this page</button>
    <div class="capture-progress" id="capture-progress" hidden
         role="progressbar" aria-label="Capture progress"
         aria-valuemin="0" aria-valuemax="100">
      <div class="capture-progress-fill" id="capture-progress-fill"></div>
    </div>
    <div class="capture-status panel" id="capture-status" role="status" aria-live="polite" aria-atomic="true"></div>
    <a class="capture-link" id="capture-link" hidden target="_blank" rel="noopener">View in Clepsydra</a>
    <div class="error panel" id="error-msg" role="alert"></div>
  </main>
  <footer class="rail rail-bottom">
    <div class="status">
      <div class="dot" id="status-dot"></div>
      <span id="status-text" role="status" aria-live="polite" aria-atomic="true">Checking…</span>
    </div>
    <a class="settings-link" href="#" id="options-link">Settings</a>
  </footer>
  <script src="popup.js" type="module"></script>
</body>
</html>
