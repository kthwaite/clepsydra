<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/styles/vessel.css">
  <style>
    /* Popup-specific layout. The palette, type, controls and focus ring come
       from /styles/vessel.css, which both extension pages share. */
    body {
      width: 320px;
    }
    .body {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding: var(--space-3);
    }
    .captured-indicator {
      padding: var(--space-2);
      border: 1px solid var(--rule-soft);
      border-left: 2px solid var(--warn);
      background: var(--paper-2);
      color: var(--ink-2);
      font-size: var(--fs-s);
      line-height: var(--line-height-copy);
      overflow-wrap: anywhere;
    }
    .capture-tags {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .capture-tags .field-label {
      margin-bottom: 0;
    }
    .tag-list {
      display: flex;
      min-height: 20px;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-1);
      color: var(--ink-mute);
      font-size: var(--fs-s);
    }
    /* An empty live region must not hold open a row of dead space. */
    .tag-list:empty {
      min-height: 0;
    }
    .tag-remove {
      min-height: 0;
      padding: 0;
      border: none;
      background: none;
      color: var(--ink-mute);
      font-size: var(--fs);
      letter-spacing: 0;
      line-height: 1;
    }
    .tag-remove:hover:not(:disabled) {
      border: none;
      background: none;
      color: var(--hot);
    }
    /* Suggested tags are chips that happen to be buttons: they keep the chip's
       lowercase vault spelling rather than the tracked uppercase of a control. */
    .tag-suggested {
      cursor: pointer;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: none;
    }
    .tag-suggested::before {
      content: "+";
      color: var(--accent);
    }
    .tag-suggested:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--highlight);
      color: var(--ink);
    }
    .tag-suggestions {
      max-height: 132px;
      margin: 0;
      padding: 0;
      border: 1px solid var(--rule);
      border-top: none;
      background: var(--paper);
      list-style: none;
      overflow-y: auto;
    }
    .tag-suggestions [role="option"] {
      padding: var(--space-1) var(--space-2);
      color: var(--ink-2);
      letter-spacing: 0.04em;
      cursor: pointer;
    }
    .tag-suggestions [role="option"][aria-selected="true"],
    .tag-suggestions [role="option"]:hover {
      background: var(--highlight);
      color: var(--ink);
      font-weight: 700;
    }
    #capture-btn {
      width: 100%;
    }
    .capture-progress {
      height: 4px;
      border: 1px solid var(--rule);
      background: var(--paper-2);
    }
    .capture-progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 150ms ease-out;
    }
    .capture-progress-fill.indeterminate {
      width: 30%;
      animation: capture-progress-slide 1.2s ease-in-out infinite alternate;
    }
    @keyframes capture-progress-slide {
      from { margin-left: 0; }
      to { margin-left: 70%; }
    }
    /* Signal hues follow the app's telemetry: --cool reads, --accent works,
       --ok settles, --warn hesitates, --hot fails. */
    .capture-status {
      display: none;
    }
    .capture-status[data-tone="reading"] { color: var(--cool); }
    .capture-status[data-tone="processing"] { color: var(--accent); }
    .capture-status[data-tone="success"] { color: var(--ok); }
    .capture-status[data-tone="conflict"] { color: var(--warn); }
    .capture-status[data-tone="error"] { color: var(--hot); }
    .capture-link {
      display: inline-block;
      align-self: flex-start;
      font-size: var(--fs-s);
      letter-spacing: var(--track);
      text-transform: uppercase;
    }
    .error {
      display: none;
      color: var(--hot);
    }
    /* Footer rail — the popup's share of the app's status bar. */
    .status {
      display: flex;
      min-width: 0;
      flex: 1;
      align-items: center;
      gap: var(--space-2);
      padding: 3px var(--space-3);
    }
    .dot {
      flex: none;
      width: 6px;
      height: 6px;
      background: var(--ink-faint);
    }
    .dot.connected { background: var(--cool); }
    .dot.disconnected { background: var(--hot); }
    #status-text {
      min-width: 0;
      overflow-wrap: anywhere;
      opacity: 0.8;
    }
    .settings-link {
      display: inline-flex;
      min-height: 24px;
      flex: none;
      align-items: center;
      padding: 0 var(--space-3);
      border: none;
      border-left: 1px solid var(--bar-rule);
      color: var(--ink-mute);
      letter-spacing: var(--track);
      text-transform: uppercase;
    }
    .settings-link:hover {
      background: none;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header class="rail rail-top">
    <div class="wordmark"><span class="wordmark-lead">C</span>lepsydra</div>
    <div class="rail-label">Web Archive</div>
  </header>
  <main class="body">
    <div class="captured-indicator" id="captured-indicator" hidden></div>
    <section class="capture-tags" aria-labelledby="capture-tags-label">
      <div id="capture-tags-label" class="field-label">Defaults</div>
      <div id="default-tags" class="tag-list" aria-live="polite">Loading…</div>
      <label class="field-label" for="additional-tags">Additional tags</label>
      <div id="selected-tags" class="tag-list" aria-live="polite"></div>
      <input id="additional-tags" type="text" autocomplete="off" role="combobox"
             aria-expanded="false" aria-controls="tag-suggestions" aria-autocomplete="list"
             placeholder="research, reading" aria-describedby="additional-tags-help">
      <ul id="tag-suggestions" class="tag-suggestions" role="listbox" hidden></ul>
      <div id="suggested-tags" class="tag-list" role="group" aria-label="Suggested from this page" hidden></div>
      <p id="additional-tags-help" class="field-help">Applies only to this capture. Type to search vault tags. Suggested tags come from this page.</p>
    </section>
    <button id="capture-btn" class="btn-primary">Capture This Page</button>
    <div class="capture-progress" id="capture-progress" hidden
         role="progressbar" aria-label="Capture progress"
         aria-valuemin="0" aria-valuemax="100">
      <div class="capture-progress-fill" id="capture-progress-fill"></div>
    </div>
    <div class="capture-status panel" id="capture-status" role="status" aria-live="polite" aria-atomic="true"></div>
    <a class="capture-link" id="capture-link" hidden target="_blank" rel="noopener">View in Clepsydra</a>
    <div class="error panel" id="error-msg" role="alert"></div>
  </main>
  <footer class="rail rail-bottom">
    <div class="status">
      <div class="dot" id="status-dot"></div>
      <span id="status-text" role="status" aria-live="polite" aria-atomic="true">Checking…</span>
    </div>
    <a class="settings-link" href="#" id="options-link">Settings</a>
  </footer>
  <script src="popup.js" type="module"></script>
</body>
</html>
