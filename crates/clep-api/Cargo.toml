[package]
name = "clep-api"
version.workspace = true
edition.workspace = true
publish = false

[features]
# Enables the directory-flush/sync fault-injection hooks in
# `vault::atomic_file` and `vault::rubbish` for another crate's tests.
test-failpoints = [
    "clep-vault/test-failpoints",
    "clep-archive/test-failpoints",
    "clep-feeds/test-failpoints",
]

[dependencies]
axum = { workspace = true }
axum-extra = { workspace = true }
axum-server = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
clep-academic = { workspace = true }
clep-archive = { workspace = true }
clep-bases = { workspace = true }
clep-config = { workspace = true }
clep-feeds = { workspace = true }
clep-gitsync = { workspace = true }
clep-index = { workspace = true }
clep-mutate = { workspace = true }
clep-vault = { workspace = true }
dirs = { workspace = true }
mime_guess = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = { workspace = true }
regex = { workspace = true }
quick-xml = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
bytes = { workspace = true }
http-body = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
axum-test = { workspace = true }
serial_test = { workspace = true }
wiremock = { workspace = true }
clep-archive = { workspace = true, features = ["test-failpoints"] }
clep-doctor = { workspace = true }
clep-feeds = { workspace = true, features = ["test-failpoints"] }
clep-gitsync = { workspace = true, features = ["test-support"] }
clep-test-support = { workspace = true }
clep-vault = { workspace = true, features = ["test-failpoints"] }
