[package]
name = "clepsydra"
version.workspace = true
edition.workspace = true

[[bin]]
name = "clep"
path = "src/bin/cli.rs"

[features]
# Enables the directory-flush/sync fault-injection hooks in
# `vault::atomic_file` and `vault::rubbish` for another crate's tests.
test-failpoints = []

[dependencies]
ammonia = { workspace = true }
anstream = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
axum-server = { workspace = true }
base64 = { workspace = true }
biblatex = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clep-config = { workspace = true }
dirs = { workspace = true }
feed-rs = { workspace = true }
fs4 = { workspace = true }
gethostname = { workspace = true }
glob = { workspace = true }
lol_html = { workspace = true }
mime_guess = { workspace = true }
notify-debouncer-mini = { workspace = true }
owo-colors = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = { workspace = true }
pulldown-cmark = { workspace = true }
regex = { workspace = true }
quick-xml = { workspace = true }
reqwest = { workspace = true }
ropey = { workspace = true }
rusqlite = { workspace = true }
rustix = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower-lsp = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-normalization = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
bytes = { workspace = true }
http-body = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
axum-test = { workspace = true }
serial_test = { workspace = true }
wiremock = { workspace = true }
clep-test-support = { workspace = true }

[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.dependencies]
clep-test-support = { path = "crates/clep-test-support" }
clep-config = { path = "crates/clep-config" }
ammonia = "4"
anstream = "1.0.0"
axum = { version = "0.8.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["query"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22"
biblatex = "0.11"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.56", features = ["derive"] }
config = "0.15.19"
dirs = "6"
feed-rs = "2"
fs4 = "1.1"
gethostname = "1"
glob = "0.3"
lol_html = "3.0.1"
mime_guess = "2"
notify-debouncer-mini = "0.5"
owo-colors = "4.3.0"
parking_lot = "0.12"
percent-encoding = "2"
pulldown-cmark = "0.13"
regex = "1"
quick-xml = "0.37"
reqwest = { version = "0.12", features = ["json"] }
ropey = "1"
rusqlite = { version = "0.33", features = ["backup", "bundled"] }
rustix = { version = "1.1", features = ["fs"] }
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tar = "0.4"
tempfile = "3"
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = { version = "0.8", features = ["preserve_order"] }
toml_edit = "0.22"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace"] }
tower-lsp = "0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
unicode-normalization = "0.1"
url = "2"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
uuid = { version = "1", features = ["v7", "serde"] }
walkdir = "2"
rmcp = { version = "3.1.0", features = ["server", "transport-io"] }
schemars = "1.2.2"
bytes = "1"
http-body = "1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
axum-test = "18"
serial_test = "3"
wiremock = "0.6"
